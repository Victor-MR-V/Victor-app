name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix App Secrets and Build APK
        run: |
          ROOT_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$ROOT_DIR"
          
          # প্রজেক্টের মেইন রুটে ফাইল তৈরি
          touch .env.example
          touch .env
          
          # প্লাগইনের এরর এড়াতে app/ ফোল্ডারের ভেতরেও ফাইলগুলো তৈরি করা
          if [ -d "app" ]; then
            touch app/.env.example
            touch app/.env
          fi
          
          # ফাইনাল অ্যান্ড্রয়েড বিল্ড কমান্ড রান করা
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
