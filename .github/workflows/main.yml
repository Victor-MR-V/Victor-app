name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Custom Profile and Build Ultra Fast Release APK
        run: |
          ROOT_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$ROOT_DIR"
          
          # মিসিং এনভায়রনমেন্ট ফাইল তৈরি
          touch .env.example .env
          if [ -d "app" ]; then
            touch app/.env.example app/.env
          fi
          
          # আপনার আপলোড করা ছবিটিকে অ্যাপের ভেতরে কপি করা
          if [ -f "my_profile.jpg" ]; then
            cp my_profile.jpg app/src/main/res/drawable/img_victor_profile.jpg
          elif [ -f "../my_profile.jpg" ]; then
            cp ../my_profile.jpg app/src/main/res/drawable/img_victor_profile.jpg
          fi
          
          # রিলিজ মোডের জন্য একটি টেম্পোরারি Keystore ফাইল জেনারেট করা
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          
          # রিলিজ সাইনিং এনভায়রনমেন্ট সেটআপ করা যাতে কোডের পাসওয়ার্ডের সাথে মিলে যায়
          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          export STORE_PASSWORD="android"
          export KEY_PASSWORD="android"
          
          # অ্যাপের বাটন সুপার-ফাস্ট করার জন্য ফাইনাল RELEASE বিল্ড কমান্ড রান করা
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Ultra Fast Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
